<svg viewBox="0 0 440 460" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<linearGradient id="heroDeviceBody" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#1c2030"/>
			<stop offset="100%" stop-color="#0a0c14"/>
		</linearGradient>
		<linearGradient id="heroScreen" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#00e5ff" stop-opacity="0.32"/>
			<stop offset="100%" stop-color="#ff2fb0" stop-opacity="0.22"/>
		</linearGradient>
		<linearGradient id="heroScreen2" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#ff2fb0" stop-opacity="0.25"/>
			<stop offset="100%" stop-color="#00e5ff" stop-opacity="0.30"/>
		</linearGradient>
	</defs>

	<!-- computador (monitor), ao fundo -->
	<g class="hero-float hero-float-1">
		<g transform="translate(70,30)">
			<rect x="0" y="0" width="230" height="150" rx="14" fill="url(#heroDeviceBody)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
			<rect x="10" y="10" width="210" height="130" rx="8" fill="url(#heroScreen)"/>
			<rect x="10" y="10" width="210" height="130" rx="8" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.2"/>
			<rect x="105" y="150" width="20" height="24" fill="#12141f"/>
			<rect x="70" y="172" width="90" height="10" rx="5" fill="#12141f" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
			<g opacity="0.8">
				<rect x="26" y="30" width="70" height="8" rx="4" fill="#ffffff" opacity="0.6"/>
				<rect x="26" y="48" width="46" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
				<circle cx="180" cy="45" r="18" fill="#00e5ff" opacity="0.55"/>
			</g>
		</g>
	</g>

	<!-- notebook, sobreposto na frente e à esquerda -->
	<g class="hero-float hero-float-2">
		<g transform="translate(18,175)">
			<path d="M0 92 L18 30 H198 L216 92 Z" fill="url(#heroDeviceBody)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
			<rect x="26" y="0" width="164" height="104" rx="8" fill="url(#heroDeviceBody)" stroke="rgba(255,255,255,0.14)" stroke-width="2" transform="translate(0,-74)"/>
			<rect x="34" y="-66" width="148" height="88" rx="5" fill="url(#heroScreen2)"/>
			<g opacity="0.85">
				<rect x="48" y="-52" width="80" height="7" rx="3.5" fill="#ffffff" opacity="0.6"/>
				<rect x="48" y="-36" width="56" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
				<rect x="48" y="-18" width="100" height="26" rx="6" fill="rgba(255,255,255,0.1)"/>
			</g>
			<rect x="88" y="86" width="40" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
		</g>
	</g>

	<!-- tablet, apoiado à direita -->
	<g class="hero-float hero-float-3">
		<g transform="translate(276,150) rotate(7)">
			<rect x="0" y="0" width="118" height="160" rx="16" fill="url(#heroDeviceBody)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
			<rect x="9" y="12" width="100" height="136" rx="8" fill="url(#heroScreen)"/>
			<circle cx="59" cy="152" r="2.6" fill="rgba(255,255,255,0.35)"/>
			<g opacity="0.85">
				<rect x="20" y="28" width="60" height="7" rx="3.5" fill="#ffffff" opacity="0.55"/>
				<rect x="20" y="46" width="40" height="6" rx="3" fill="#ffffff" opacity="0.3"/>
				<rect x="20" y="70" width="78" height="56" rx="8" fill="rgba(255,255,255,0.08)"/>
			</g>
		</g>
	</g>

	<!-- celular, em primeiro plano -->
	<g class="hero-float hero-float-4">
		<g transform="translate(150,270) rotate(-6)">
			<rect x="0" y="0" width="108" height="196" rx="22" fill="url(#heroDeviceBody)" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
			<rect x="7" y="10" width="94" height="176" rx="15" fill="url(#heroScreen2)"/>
			<rect x="40" y="0" width="28" height="6" rx="3" fill="rgba(0,0,0,0.5)"/>
			<circle cx="54" cy="180" r="2.4" fill="rgba(255,255,255,0.4)"/>
			<g opacity="0.9">
				<rect x="18" y="34" width="52" height="7" rx="3.5" fill="#ffffff" opacity="0.65"/>
				<rect x="18" y="50" width="36" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
				<rect x="18" y="120" width="72" height="46" rx="10" fill="rgba(255,255,255,0.1)"/>
				<circle cx="40" cy="143" r="9" fill="#00e5ff" opacity="0.7"/>
			</g>
		</g>
	</g>

	<!-- brilhos -->
	<circle cx="30" cy="60" r="4" fill="#00e5ff" opacity="0.8"/>
	<circle cx="410" cy="120" r="3.5" fill="#ff2fb0" opacity="0.7"/>
	<circle cx="390" cy="360" r="3" fill="#00e5ff" opacity="0.6"/>
</svg>